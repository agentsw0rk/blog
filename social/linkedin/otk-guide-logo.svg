<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Open Knowledge Format teaser image</title>
  <desc id="desc">Terminal-style LinkedIn teaser image for an agentsbl0g article about Open Knowledge Format and portable AI agent memory.</desc>
  <defs>
    <linearGradient id="ansiGradient" x1="120" y1="0" x2="1080" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16a66f"/>
      <stop offset="0.30" stop-color="#0ca6cc"/>
      <stop offset="0.58" stop-color="#d69a00"/>
      <stop offset="0.82" stop-color="#0ca6cc"/>
      <stop offset="1" stop-color="#16a66f"/>
    </linearGradient>
    <pattern id="knowledgeGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <rect width="34" height="34" fill="none"/>
      <circle cx="8" cy="8" r="2" fill="#0b161d" opacity="0.12"/>
      <circle cx="26" cy="26" r="2" fill="#0ca6cc" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="54" y="54" width="1092" height="522" rx="0" fill="#ffffff" stroke="#0b161d" stroke-width="3"/>
  <line x1="54" y1="118" x2="1146" y2="118" stroke="#0b161d" stroke-width="3"/>
  <circle cx="86" cy="86" r="8" fill="#0b161d"/>
  <circle cx="116" cy="86" r="8" fill="#0b161d"/>
  <circle cx="146" cy="86" r="8" fill="#0b161d"/>
  <text x="1100" y="93" text-anchor="end" fill="#0b161d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" letter-spacing="1">agentsbl0g</text>

  <rect x="132" y="154" width="936" height="330" fill="url(#knowledgeGrid)" opacity="0.30"/>
  <line x1="312" y1="455" x2="888" y2="455" stroke="#0b161d" stroke-width="2" opacity="0.18" stroke-dasharray="4 14"/>

  <text x="600" y="254" text-anchor="middle" fill="url(#ansiGradient)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="76" font-weight="900" letter-spacing="0">OPEN KNOWLEDGE</text>
  <text x="600" y="352" text-anchor="middle" fill="url(#ansiGradient)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="96" font-weight="900" letter-spacing="0">FORMAT</text>
  <text x="600" y="430" text-anchor="middle" fill="#0b161d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="900" letter-spacing="1">PORTABLE MEMORY FOR AI AGENTS</text>

  <text x="600" y="512" text-anchor="middle" fill="#0b161d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700">MARKDOWN · GRAPH · CONTEXT · GIT · TOOLS</text>
